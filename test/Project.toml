# PACKAGE-OWNED — scaffold writes this once and never overwrites it.
# The test environment. Seeded with the deps the shared QA helpers and AD
# harness need; add the package's own test-only deps here. EpiAwarePackageTools
# supplies the helpers; it is registered, so it is bounded in `[compat]`.
[deps]
ADTypes = "47edcb42-4c32-4615-8424-f2b9edc5f35b"
Aqua = "4c88cf16-eb10-579e-8560-4a9242c79595"
BenchmarkTools = "6e4b80f9-dd63-53aa-95a3-0cdb28fa8baf"
CairoMakie = "13f3f980-e62b-5c42-98c6-ff1f3baf88f0"
DataFrames = "a93c6f00-e57d-5684-b7b6-d8193f3e46c0"
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
DifferentiationInterface = "a0c0ee7d-e4b9-4e03-894e-1c5f64a51d63"
DifferentiationInterfaceTest = "a82114a7-5aa3-49a8-9643-716bb13727a3"
Distributions = "31c24e10-a181-5473-b8eb-7969acd0382f"
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
EpiAwarePackageTools = "7aaea248-0d11-4a0d-a7dc-86da30abb951"
ExplicitImports = "7d51a73a-1435-4ff3-83d9-f097790105c7"
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
JET = "c3a54625-cd67-489e-a8e7-0a5a0ff4e31b"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Runic = "62bfec6d-59d7-401d-8490-b29ee721c001"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TestItemRunner = "f8b46487-2199-4994-9208-9a1283c18c0a"
TestItems = "1c621080-faea-4a02-84b6-bbd5e436b8fe"
EpiNow2 = "104aee9f-613f-4156-b2ce-c4bbd753b83e"

# Bounded compat for the seeded QA + AD deps. The package under test is
# pinned by `[sources]`, so carries no compat entry.
# Add a bound for each test-only dep you add.
# Every bound here has to resolve on every leg of the `test.yaml` matrix,
# lts included: JET reaches 0.9 for that reason (it publishes nothing past
# 0.9.18 for 1.10), matching the no-AD variant.
[compat]
ADTypes = "1"
Aqua = "0.8"
BenchmarkTools = "1.4"
CairoMakie = "0.15"
DataFrames = "1.6"
Dates = "1"
DifferentiationInterface = "0.6, 0.7"
DifferentiationInterfaceTest = "0.9, 0.10, 0.11"
Distributions = "0.25"
Documenter = "1"
EpiAwarePackageTools = "0.3, 0.4"
ExplicitImports = "1.6"
ForwardDiff = "0.10, 1"
JET = "0.9, 0.10, 0.11, 0.12, 0.13"
Pkg = "1"
Random = "1"
Runic = "1"
Statistics = "1"
Test = "1"
TestItemRunner = "~1.1"
TestItems = "1"

[sources]
EpiNow2 = {path = ".."}
